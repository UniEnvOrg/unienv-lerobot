name: Pytest Package Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU builds of torch keep the job small; the tests need no GPU
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install "lerobot>=0.7,<0.8" pytest
        # The policy interface with observe_transition(..., dt) is on UniEnv's main branch until 0.0.1b17 is released
        pip install "unienv @ git+https://github.com/UniEnvOrg/UniEnv@main"
        pip install --no-deps -e .
    - name: Test with pytest
      run: |
        pytest tests
